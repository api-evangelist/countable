aid: countable
name: Countable
description: 'Countable was a civic-engagement technology company backed by Canaan Partners
  (seed, partner Joydeep Bhattacharyya) that built a digital platform helping citizens
  understand what Congress was doing in Washington and contact their elected representatives
  directly, later extending the same advocacy tooling to organizations and brands.
  As of this enrichment pass the Countable brand is no longer operating independently:
  both countable.com and countable.us HTTP 302 to https://www.myactionable.com/, the
  home of Actionable, a self-service advocacy campaign platform made by CSAG that offers
  petitions, pledges, lawmaker-message campaigns, supporter video collection, lead capture,
  polling and in-platform real-time campaign reporting on a $29.99/month self-service
  plan. No public developer portal, API documentation, OpenAPI definition, SDK, package,
  webhook catalog, MCP server or /.well-known discovery surface was found on either the
  legacy Countable hosts or the successor Actionable host during this pass.'
